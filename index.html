<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anna – German Teaching Agent</title>
<style>
:root{--bg:#f5f6fb;--c:#fff;--t:#172036;--m:#6b7590;--a:#d33b3b;--a2:#f2a31b;--b:#e3e7f0;--sh:0 1px 2px rgba(16,24,40,.06),0 6px 20px rgba(16,24,40,.07)}
@media(prefers-color-scheme:dark){:root{--bg:#0f1117;--c:#181c26;--t:#e9ecf5;--m:#8f98b2;--a:#ff6b6b;--a2:#ffc457;--b:#272d3d;--sh:0 6px 24px rgba(0,0,0,.35)}}
*{box-sizing:border-box}body{margin:0;font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--t)}
header{background:linear-gradient(135deg,#1c1c1c,#b32626 60%,#e6a017);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}header b{font-size:18px}
#chips span{background:rgba(255,255,255,.18);border-radius:20px;padding:3px 10px;margin-left:6px;font-size:13px}
main{max-width:920px;margin:auto;padding:16px 16px 40px}h2{margin:4px 0 8px}
.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:16px;margin:12px 0;box-shadow:var(--sh)}
button,label.btn{background:var(--a);color:#fff;border:0;border-radius:10px;padding:9px 16px;cursor:pointer;font:inherit;font-weight:600;text-align:center}
button.g,label.btn{background:transparent;color:var(--a);border:1px solid var(--b);font-weight:500}button.g:hover{border-color:var(--a)}
input[type=text],input:not([type]),select{width:100%;padding:9px 11px;border:1px solid var(--b);border-radius:10px;background:var(--bg);color:var(--t);font:inherit}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}.row>*{flex:1;min-width:120px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}}
.bar{height:8px;background:var(--b);border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--a2))}
.m{color:var(--m)}.note{background:rgba(242,163,27,.15);border-radius:10px;padding:8px 12px}.un{padding:3px 0}.un.cur{font-weight:700}.foot{margin-top:18px}
.msg{padding:10px 14px;border-radius:14px;margin:8px 0;max-width:90%}.msg.u{background:linear-gradient(135deg,var(--a),#b32626);color:#fff;margin-left:auto}.msg.a{background:var(--bg);border:1px solid var(--b)}
b.de{color:var(--a);font-size:1.05em}#log{max-height:56vh;overflow:auto;padding:4px}
.sp{display:inline-block;width:16px;height:16px;border:3px solid var(--b);border-top-color:var(--a);border-radius:50%;animation:s .8s linear infinite;vertical-align:-3px;margin-right:8px}@keyframes s{to{transform:rotate(360deg)}}
.live{animation:pl 1.4s infinite}@keyframes pl{0%{box-shadow:0 0 0 0 rgba(211,59,59,.6)}100%{box-shadow:0 0 0 14px rgba(211,59,59,0)}}
details{margin:6px 0}summary{cursor:pointer}
</style></head><body>
<header><b>🇩🇪 Anna · German Teaching Agent</b><div id="chips"></div></header><main id="app"></main>
<script>
const $=s=>document.querySelector(s),R=h=>$('#app').innerHTML=h,esc=t=>String(t??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const load=m=>`<div class="card"><span class="sp"></span>${m}</div>`;
let S=null;try{S=JSON.parse(localStorage.getItem('gt1'))}catch(e){}
const save=()=>{try{localStorage.setItem('gt1',JSON.stringify(S))}catch(e){}};
const LV=['A1','A2','B1','B2','C1'],DAYS=[0,1,3,7,16,35];
const CUR={
A1:["Sounds & alphabet|alphabet, umlauts ä ö ü, ß, ch/sch/sp/st, word stress; Hallo, Guten Tag, Tschüss","Introducing yourself|ich heiße / komme aus / wohne in; sein, heißen; W-questions Wie, Woher, Wo","Numbers, time & dates|0-100, Uhrzeit, Wochentage, Monate; Wie spät ist es?","Family & people|Familie, haben, mein/dein, der/die/das, plural basics","Food & drink|ich möchte, Akkusativ (einen/eine/ein), ordering in a café, prices","Daily routine|regular verbs, separable verbs (aufstehen), verb in position 2, um/am","Home & city|Wohnung, Zimmer, in/auf/an + Dativ basics, directions","Shopping & clothes|Kleidung, Farben, kosten, kein/nicht","Hobbies & weekend|gern/lieber, können/müssen/wollen, Satzklammer","A1 exam skills|Start Deutsch 1: forms, short message, Sprechen cards (Fragen, Bitten)"],
A2:["Past events|Perfekt with haben/sein, Partizip II","Health & body|Körper, beim Arzt, sollen, Imperativ","Travel & transport|Verkehrsmittel, Reisen, Präteritum sein/haben, weil/dass","Work & school|Berufe, Termine, Nebensätze wenn/weil","Plans & feelings|werden, Komparativ/Superlativ, reflexive Verben","Living & neighbours|Dativ, Wechselpräpositionen, Einladung, E-Mail","Services & politeness|Telefonieren, Reklamation, könnten Sie…","A2 exam skills|SMS, E-Mail with 3 points, gemeinsam etwas planen"],
B1:["Experiences & stories|Präteritum, als/wenn, erzählen","Opinions & discussion|Meinung äußern, obwohl/deshalb/denn, Forumsbeitrag","Work & applications|Bewerbung, Konjunktiv II, Relativsätze","Media & technology|Passiv Präsens, Infinitiv mit zu, Vor-/Nachteile","Society & environment|Genitiv, Nomen-Verb-Verbindungen, Umwelt","Presentations|Präsentation Struktur, Redemittel","Formal communication|formelle E-Mail, Beschwerde, Bitte","B1 exam skills|Lesen/Hören Strategien, Sprechen planen/präsentieren/reagieren"],
B2:["Argumentation|Pro/Contra, einerseits…andererseits, Nominalisierung","Passive & subjunctive|Passiv Vergangenheit, Konjunktiv I/II, indirekte Rede","Work & society|Wirtschaft, Bildung, Statistik beschreiben","Media & science|Partizipialattribute, Zusammenfassung","Formal writing|Leserbrief, Forumsbeitrag 150 Wörter","B2 exam skills|Diskussion, Präsentation, Hörverstehen Radio/Vortrag"],
C1:["Academic register|Nominalstil, komplexe Sätze","Nuance & style|Idiome, Register, Modalpartikeln","Debate & rhetoric|Argumentieren, Vortrag, Diskussion","C1 exam skills|Goethe C1 Formate"]};
const SHARE={A1:'about 15%',A2:'about 35%',B1:'about 60%',B2:'about 80%',C1:'almost 100%'};
if(!S)S=null;else{S.srs=S.srs||[];S.hist=S.hist||[];S.weak=S.weak||[];S.st=S.st||{n:0,last:''}}

/* ---------- AI providers with automatic fallback ---------- */
const PV={groq:{n:'Groq',url:'https://api.groq.com/openai/v1/chat/completions',m:'openai/gpt-oss-120b',h:'console.groq.com/keys'},gemini:{n:'Gemini',m:'gemini-3.5-flash',h:'aistudio.google.com/apikey'},or:{n:'OpenRouter',url:'https://openrouter.ai/api/v1/chat/completions',m:'openrouter/free',h:'openrouter.ai/keys'}};
const parse=t=>{t=t.replace(/```json|```/g,'').trim();try{return JSON.parse(t)}catch(e){return JSON.parse(t.slice(t.indexOf('{'),t.lastIndexOf('}')+1))}};
async function call(p,msgs,sys,json){
 if(p.id=='gemini'){const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${p.model}:generateContent?key=${p.key}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({systemInstruction:{parts:[{text:sys||''}]},contents:msgs,generationConfig:json?{responseMimeType:'application/json'}:{}})});const d=await r.json();if(d.error)throw new Error(d.error.message);return d.candidates[0].content.parts.map(x=>x.text||'').join('')}
 const r=await fetch(PV[p.id].url,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+p.key},body:JSON.stringify({model:p.model,messages:[{role:'system',content:sys||''},...msgs.map(m=>({role:m.role=='user'?'user':'assistant',content:m.parts[0].text}))]})});
 const d=await r.json();if(d.error)throw new Error(d.error.message||JSON.stringify(d.error));return d.choices[0].message.content}
async function ai(p,sys,json){let msgs=Array.isArray(p)?p:[{role:'user',parts:[{text:p}]}];if(msgs.length>14)msgs=[msgs[0],...msgs.slice(-12)];let last,q=0;
 for(const pr of S.provs)for(let k=0;k<2;k++){try{const t=await call(pr,msgs,sys,json);return json?parse(t):t}catch(e){last=e;if(/quota|rate.?limit|429|exceed/i.test(e.message)){q=1;break}await new Promise(r=>setTimeout(r,1000))}}
 throw new Error(q?'Free quota reached. Wait a minute or add another free key in Settings (Groq has the biggest free limit).':'All AI providers failed: '+last.message)}

/* ---------- Voice: premium (Gemini TTS) with browser fallback ---------- */
let V={mic:0,sp:0,live:0,sid:0,rl:'en-GB',rec:null,busy:0,nop:0,rate:1,mode:'',last:null,cur:null},AC,M=[],hb=[],ht;
const vo=l=>{const sc=v=>(/natural|neural|online/i.test(v.name)?4:0)+(/google/i.test(v.name)?2:0)+(/microsoft/i.test(v.name)?1:0);return speechSynthesis.getVoices().filter(v=>v.lang.replace('_','-').toLowerCase().startsWith(l)).sort((a,b)=>sc(b)-sc(a))[0]};
const st=m=>{const e=$('#st');if(e)e.textContent=m},ml=()=>{const e=$('#ml');if(e)e.textContent=V.rl=='de-DE'?'🇩🇪 Deutsch':'🇬🇧 English'};
async function gtts(text){const k=S.provs.find(p=>p.id=='gemini');const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${S.tts}:generateContent?key=${k.key}`,{method:'POST',headers:{'Content-Type':'application/json'},
 body:JSON.stringify({contents:[{parts:[{text:'Say warmly and naturally, like a friendly teacher, with an authentic German accent on German words: '+text}]}],generationConfig:{responseModalities:['AUDIO'],speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:'Kore'}}}}})});
 const d=await r.json(),b=d.candidates?.[0]?.content?.parts?.[0]?.inlineData?.data;if(!b)throw new Error(d.error?.message||'no audio');
 const bin=atob(b),n=bin.length>>1;AC=AC||new AudioContext();await AC.resume();const buf=AC.createBuffer(1,n,24000),ch=buf.getChannelData(0);
 for(let i=0;i<n;i++){let v=bin.charCodeAt(2*i)|bin.charCodeAt(2*i+1)<<8;if(v>32767)v-=65536;ch[i]=v/32768}
 return new Promise(res=>{const s=AC.createBufferSource();s.buffer=buf;s.connect(AC.destination);s.onended=res;V.cur=s;s.start()})}
function bspeak(parts){return new Promise(async res=>{speechSynthesis.cancel();const my=++V.sid;
 for(const p of parts)for(const c of p.t.match(/[^.!?\n]+[.!?]*/g)||[p.t]){if(my!==V.sid)return res();await new Promise(r=>{const L=p.l=='de'?'de-DE':'en-GB',u=new SpeechSynthesisUtterance(c.trim());u.lang=L;u.voice=vo(p.l=='de'?'de':'en-gb')||vo('en')||null;u.rate=(p.l=='de'?.85:1)*V.rate;u.onend=u.onerror=r;speechSynthesis.speak(u)})}res()})}
async function speak(parts,slow){V.sp=1;stopRec();
 try{if(!slow&&S.premium&&Date.now()>V.nop&&S.provs.some(p=>p.id=='gemini'))await gtts(parts.map(p=>p.t).join(' '));else{V.rate=slow?.7:1;await bspeak(parts);V.rate=1}}
 catch(e){V.nop=Date.now()+300000;st('Premium voice unavailable, using the browser voice for now.');await bspeak(parts)}V.sp=0;startRec()}
function stopRec(){try{V.rec&&V.rec.abort()}catch(e){}}
function stopAll(){V.sid++;speechSynthesis.cancel();try{V.cur&&V.cur.stop()}catch(e){}stopRec();V.sp=0}
function startRec(){if(!V.mic||V.sp||V.live)return;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){V.mic=0;return alert('Voice input needs Chrome or Edge. You can still type.')}
 const r=V.rec=new SR();r.lang=V.rl;r.continuous=true;r.interimResults=false;r.onstart=()=>{V.live=1;const b=$('#mb');if(b)b.classList.add('live')};
 r.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)heard(e.results[i][0].transcript)};
 r.onerror=e=>{if(/not-allowed|service-not-allowed/.test(e.error)){V.mic=0;alert('Microphone is blocked. Allow it via the lock icon in the address bar, then reload.')}};
 r.onend=()=>{V.live=0;const b=$('#mb');if(b)b.classList.remove('live');if(V.mic&&!V.sp)setTimeout(startRec,300)};try{r.start()}catch(e){}}
function heard(t){const c=t.toLowerCase().trim(),e=$('#st');if(e)e.textContent='🗣 '+t;
 if(/^(please )?(repeat|again|say (that|it) again|wiederhole|noch ?mal)\W*$/.test(c))return replay();if(/^(slow|slowly|slower|langsamer)\W*$/.test(c))return replay(1);if(/^(stop|end lesson|finish|that'?s all|stopp)\W*$/.test(c))return endLesson();
 hb.push(t);clearTimeout(ht);ht=setTimeout(()=>{const x=hb.join(' ');hb=[];send(x)},1700)}
const replay=slow=>{if(V.last)speak(V.last,slow)};
function tgl(){V.rl=V.rl=='de-DE'?'en-GB':'de-DE';stopRec();ml()}
function micT(){V.mic=!V.mic;const b=$('#mb');if(b)b.textContent=V.mic?'🎙 Mic on':'🎙 Mic off';V.mic?startRec():stopRec()}

/* ---------- Teaching agent ---------- */
const dueItems=()=>S.srs.filter(x=>x.due<=Date.now());
function sysP(){const L=S.lvl,u=CUR[L][Math.min(S.unit,CUR[L].length-1)].split('|'),due=dueItems().slice(0,6).map(x=>x.de+' = '+x.en).join('; ');
 return `You are Anna, a warm, patient, human-sounding German teacher. The learner's first language is English; the exam goal is the Goethe-Zertifikat. CEFR level now: ${L}${S.lvl=='A1'&&!S.hist.length?' (absolute beginner)':''}. Lesson mode: ${V.mode}. Current unit ${S.unit+1}: ${u[0]} - ${u[1]}. Due review items: ${due||'none'}. Known weak points: ${S.weak.join('; ')||'none'}.
Teaching rules: 1) Speak like a real teacher in SHORT turns (max 60 words, one idea at a time), react to what the learner said. 2) German share ${SHARE[L]}; explain in English whenever needed. 3) Teach one new item at a time: meaning, pronunciation tip using English sounds, an example, then make the learner say or use it; build up to short real-life dialogues and role-plays. 4) Correct by recasting the right form plus a one-line reason in English; praise specifically. 5) Mastery: if an attempt is not right, ask the same or a very similar item again, up to 3 attempts, then give the model answer and move on (pass=false). 6) Flow: greet, weave in the due review items conversationally, then teach the unit, finish with a short speaking role-play and an occasional cultural tip. In mode review only review. In mode placement do NOT teach: chat and ask 8-10 questions rising from A1 to B2, then end. In mode exam run a strict Goethe ${L}-style check of the unit contents (Lesen: read a short text aloud and ask questions; Hören: say a short announcement and ask questions; Schreiben: ask for a short written reply; Sprechen: a short task) with no hints, then end. 7) Adapt: too easy, speed up; struggling, slow down and revisit prerequisites. 8) After about 12-16 exchanges wrap up and set end=true.
Return JSON only: {"parts":[{"l":"en","t":"..."},{"l":"de","t":"..."}],"listen":"en","pass":null,"vocab":[{"de":"","en":""}],"end":false}. Put every German word or phrase in its own part with l=de so it is spoken with a German voice; English explanation in l=en parts. listen=de when you want the learner to speak German next, otherwise en. pass is true/false after a learner attempt, else null. vocab lists new items taught in this turn.`}
function addMsg(r,x){const l=$('#log');if(l){l.insertAdjacentHTML('beforeend',`<div class="msg ${r}">${r=='u'?esc(x):x.map(p=>p.l=='de'?`<b class="de">${esc(p.t)}</b>`:esc(p.t)).join(' ')}</div>`);l.scrollTop=1e9}}
async function send(text,hide){if(V.busy||!text.trim())return;V.busy=1;if(!hide)addMsg('u',text);M.push({role:'user',parts:[{text}]});st('Anna is thinking…');
 try{const r=await ai(M,sysP(),true);M.push({role:'model',parts:[{text:JSON.stringify(r)}]});const parts=(r.parts||[]).filter(p=>p.t);addMsg('a',parts);V.last=parts;(r.vocab||[]).forEach(v=>v.de&&S.cs.nv.push(v));
  V.rl=r.listen=='de'?'de-DE':'en-GB';ml();st(r.pass===true?'✅ Well done!':r.pass===false?'🔁 Not quite – try again':'');V.busy=0;await speak(parts);if(r.end)endLesson()}
 catch(e){V.busy=0;st('');alert(e.message)}}
function typed(){const i=$('#in'),t=i.value.trim();i.value='';send(t)}
function begin(mode){V.mode=mode;M=[{role:'user',parts:[{text:'Begin the lesson.'}]}];S.cs={nv:[],t0:Date.now()};V.mic=1;V.rl='en-GB';V.ending=0;AC=AC||new AudioContext();AC.resume();
 R(`<div class="card"><div class="row"><b>${{learn:'Lesson',review:'Review',placement:'Level check',exam:'Level exam'}[mode]} with Anna · ${S.lvl}</b><button class="g" onclick="endLesson()">■ End lesson</button></div><div id="log"></div><div id="st" class="m"></div>
 <div class="row"><input id="in" placeholder="Speak, or type here (English or German)" onkeydown="if(event.key=='Enter')typed()"><button onclick="typed()">Send</button></div>
 <div class="row"><button class="g" onclick="replay()">🔁 Repeat</button><button class="g" onclick="replay(1)">🐢 Slower</button><button class="g" onclick="tgl()">🌐 Mic: <span id="ml"></span></button><button id="mb" class="g" onclick="micT()">🎙 Mic on</button></div></div>`);ml();send('Begin the lesson.',1)}
const sp=t=>{try{return JSON.parse(t).parts.map(p=>p.t).join(' ')}catch(e){return t}};
async function endLesson(){if(V.ending)return;V.ending=1;V.mic=0;stopAll();if(M.length<4){return home()}R(load('Anna is reviewing your lesson…'));
 const tr=M.slice(1).map(m=>(m.role=='user'?'Learner: '+m.parts[0].text:'Teacher: '+sp(m.parts[0].text))).join('\n').slice(-6000),u=CUR[S.lvl][Math.min(S.unit,CUR[S.lvl].length-1)];
 try{const a=await ai(`Assess this German ${V.mode} lesson (level ${S.lvl}, unit "${u}"). Be fair but exam-realistic (Goethe-Zertifikat standards). Transcript:\n${tr}\nReturn JSON only: {"score":0-100,"unitMastered":true|false (true only if score>=75 and the learner produced the unit targets),"reviewed":[{"de":"","ok":true}],"newVocab":[{"de":"","en":""}] (max 10, items actually practised),"mistakes":[{"you":"","better":"","why":""}] (max 5),"weak":["short label"],"summary":"2 sentences","advice":"what to do next","level":"A1|A2|B1|B2|C1 (placement only)","pass":true|false (exam only)}`,'You are a strict CEFR and Goethe-Institut language assessor.',true);
  apply(a);save();summary(a)}catch(e){alert(e.message);home()}}
function apply(a){const now=Date.now();S.cs.nv.concat(a.newVocab||[]).forEach(v=>{if(v.de&&!S.srs.find(x=>x.de.toLowerCase()==v.de.toLowerCase()))S.srs.push({de:v.de,en:v.en||'',box:1,due:now+864e5})});
 (a.reviewed||[]).forEach(r=>{const x=S.srs.find(y=>y.de.toLowerCase()==String(r.de).toLowerCase());if(x){x.box=r.ok?Math.min(5,x.box+1):0;x.due=now+DAYS[x.box]*864e5+(x.box?0:36e5)}});
 S.weak=[...new Set([...(a.weak||[]),...S.weak])].slice(0,8);a.note='';
 if(V.mode=='learn'&&a.unitMastered){S.unit++;a.note='✅ Unit mastered – next unit unlocked.'}
 if(V.mode=='placement'&&LV.includes(a.level)){S.lvl=a.level;S.unit=0;a.note='🧭 Your starting level: '+a.level}
 if(V.mode=='exam'){if(a.pass){const i=LV.indexOf(S.lvl);if(i<4){S.lvl=LV[i+1];S.unit=0;a.note='🎓 Exam passed – welcome to '+S.lvl+'!'}else a.note='🎓 Course complete!'}else a.note='Not yet passed – revise the weak points and retry.'}
 const d=new Date().toDateString();if(S.st.last!==d){S.st.n=S.st.last===new Date(Date.now()-864e5).toDateString()?S.st.n+1:1;S.st.last=d}
 S.hist.push({date:new Date().toLocaleDateString(),mode:V.mode,score:a.score,summary:a.summary,advice:a.advice})}
function summary(a){R(`<div class="card"><h2>Lesson complete · ${a.score}/100</h2><p>${esc(a.summary)}</p>${a.note?`<p class="note">${esc(a.note)}</p>`:''}
 ${(a.mistakes||[]).length?'<b>Remember</b>'+a.mistakes.map(m=>`<p>❌ ${esc(m.you)}<br>✅ <b class="de">${esc(m.better)}</b><br><span class="m">${esc(m.why)}</span></p>`).join(''):''}
 ${(a.newVocab||[]).length?'<b>New words (added to your review schedule)</b><p>'+a.newVocab.map(v=>`<b class="de">${esc(v.de)}</b> – ${esc(v.en)}`).join('<br>')+'</p>':''}
 <p class="m">➡ ${esc(a.advice)}</p><button onclick="home()">Back to dashboard</button></div>`);chips();speak([{l:'en',t:(a.summary||'')+' '+(a.note||'')}])}

/* ---------- Views ---------- */
function chips(){const e=$('#chips');if(e&&S&&S.st)e.innerHTML=`<span>${S.lvl}</span><span>🔥 ${S.st.n}</span><span>🔁 ${dueItems().length}</span>`}
function home(){if(!S||!S.provs||!S.provs.length)return setup();V.mic=0;stopAll();chips();const due=dueItems().length,un=CUR[S.lvl],done=S.unit>=un.length,u=(un[S.unit]||'|').split('|');
 R(`<div class="card"><div class="m">Today · Level ${S.lvl}</div><h2>${done?'Level '+S.lvl+' complete – ready for the exam':'Unit '+(S.unit+1)+': '+esc(u[0])}</h2><p class="m">${done?'Pass the Goethe-style level exam to unlock the next level.':esc(u[1])}</p>
 <div class="bar"><i style="width:${Math.round(Math.min(S.unit,un.length)/un.length*100)}%"></i></div>
 <p>Plan (about 15–20 min): ${due?`🔁 review ${Math.min(due,6)} due words → `:''}${done?'🎓 level exam':'📘 new lesson → 🗣 speaking role-play'}</p>
 <div class="row"><button onclick="begin('${done?'exam':'learn'}')">▶ Start today's lesson</button>${due?`<button class="g" onclick="begin('review')">🔁 Review only (${due})</button>`:''}</div>
 <div class="row"><button class="g" onclick="begin('placement')">🧭 Find my level</button>${!done&&S.unit>=un.length-1?`<button class="g" onclick="begin('exam')">🎓 Level exam</button>`:''}</div></div>
 <div class="grid"><div class="card"><b>Curriculum · ${S.lvl}</b>${un.map((x,i)=>`<div class="un ${i==S.unit?'cur':''}">${i<S.unit?'✅':i==S.unit?'▶️':'⚪'} ${esc(x.split('|')[0])}</div>`).join('')}</div>

 ${Object.keys(PV).map(id=>`<label>${PV[id].n} key <span class="m">(${PV[id].h})</span><input id="k_${id}" value="${k(id)}"></label>`).join('')}
