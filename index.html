<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Polyglot Coach</title>
<style>
:root{--bg:#f4f6fb;--c:#fff;--t:#172036;--m:#6b7590;--a:#4f46e5;--a2:#7c3aed;--b:#e3e7f0;--sh:0 1px 2px rgba(16,24,40,.06),0 6px 20px rgba(16,24,40,.06)}
@media(prefers-color-scheme:dark){:root{--bg:#0e1118;--c:#171b26;--t:#e8ebf4;--m:#8f98b2;--a:#7c83ff;--a2:#a78bfa;--b:#262c3b;--sh:0 6px 24px rgba(0,0,0,.35)}}
*{box-sizing:border-box}body{margin:0;font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--t)}
header{background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}header b{font-size:18px}header span{opacity:.85;font-size:13px}
main{max-width:900px;margin:auto;padding:16px}h2,h3{margin:4px 0 8px}
.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:16px;margin:12px 0;box-shadow:var(--sh)}
button,label.btn{background:var(--a);color:#fff;border:0;border-radius:10px;padding:9px 16px;cursor:pointer;font:inherit;font-weight:600;transition:.15s}
button:hover{filter:brightness(1.1);transform:translateY(-1px)}
button.g,label.btn{background:transparent;color:var(--a);border:1px solid var(--b);font-weight:500;text-align:center}button.g:hover,label.btn:hover{border-color:var(--a)}
button.ic{background:none;color:inherit;padding:0 6px;margin-left:6px;opacity:.7}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--b);border-radius:10px;background:var(--bg);color:var(--t);font:inherit}
input:focus,textarea:focus,select:focus{outline:2px solid var(--a);outline-offset:-1px}input[type=radio],input[type=checkbox]{width:auto}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}.row>*{flex:1;min-width:120px}
.tabs{display:flex;gap:6px;background:var(--c);padding:5px;border-radius:12px;border:1px solid var(--b)}.tabs button{flex:1;background:none;color:var(--m)}.tabs .on{background:var(--a);color:#fff}
.bar{height:8px;background:var(--b);border-radius:9px;overflow:hidden;margin:6px 0 12px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--a2))}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}.stats div{background:var(--bg);border-radius:10px;padding:10px;text-align:center}.stats b{display:block;font-size:16px}.stats span{font-size:12px;color:var(--m)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}}
.note{background:rgba(124,131,255,.14);border-radius:10px;padding:8px 12px}
.msg{padding:10px 14px;border-radius:14px;margin:8px 0;white-space:pre-wrap;max-width:88%}
.u{background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;margin-left:auto;border-bottom-right-radius:4px}.a{background:var(--bg);border:1px solid var(--b);border-bottom-left-radius:4px}
#log{max-height:55vh;overflow:auto;padding:4px}.m{color:var(--m)}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid var(--b);padding:6px 4px;text-align:left}
summary{cursor:pointer}details{margin:6px 0}.foot{margin-top:18px}
.sp{display:inline-block;width:16px;height:16px;border:3px solid var(--b);border-top-color:var(--a);border-radius:50%;animation:s .8s linear infinite;vertical-align:-3px;margin-right:8px}@keyframes s{to{transform:rotate(360deg)}}
</style></head><body><header><b>🎓 Polyglot Coach</b><span>German · IELTS · AI conversation tutor</span></header><main id="app"></main>
<script>
const $=s=>document.querySelector(s),R=h=>$('#app').innerHTML=h;
const esc=t=>String(t??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const load=m=>`<div class="card"><span class="sp"></span>${m}</div>`;
let S=null;try{S=JSON.parse(localStorage.getItem('pc'))}catch(e){}
if(S&&!S.provs)S.provs=[{id:'gemini',key:S.key,model:'gemini-3.5-flash-lite'}];
const save=()=>{try{localStorage.setItem('pc',JSON.stringify(S))}catch(e){}};
let cur='de',chat=[],test=null,plays={};
const LANG={de:'de-DE',en:'en-GB'};

/* ---------- AI providers (all free tiers, auto-fallback) ---------- */
const PV={
 groq:{n:'Groq',url:'https://api.groq.com/openai/v1/chat/completions',m:'openai/gpt-oss-120b',h:'console.groq.com/keys'},
 gemini:{n:'Gemini',m:'gemini-3.5-flash-lite',h:'aistudio.google.com/apikey'},
 or:{n:'OpenRouter',url:'https://openrouter.ai/api/v1/chat/completions',m:'openrouter/free',h:'openrouter.ai/keys'}};
const parse=t=>{t=t.replace(/```json|```/g,'').trim();try{return JSON.parse(t)}catch(e){return JSON.parse(t.slice(t.indexOf('{'),t.lastIndexOf('}')+1))}};
async function call(p,msgs,sys,json){
 if(p.id=='gemini'){const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${p.model}:generateContent?key=${p.key}`,{method:'POST',headers:{'Content-Type':'application/json'},
  body:JSON.stringify({systemInstruction:{parts:[{text:sys||''}]},contents:msgs,generationConfig:json?{responseMimeType:'application/json'}:{}})});
  const d=await r.json();if(d.error)throw new Error(d.error.message);return d.candidates[0].content.parts.map(x=>x.text||'').join('')}
 const r=await fetch(PV[p.id].url,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+p.key},
  body:JSON.stringify({model:p.model,messages:[{role:'system',content:sys||''},...msgs.map(m=>({role:m.role=='user'?'user':'assistant',content:m.parts[0].text}))]})});
 const d=await r.json();if(d.error)throw new Error(d.error.message||JSON.stringify(d.error));return d.choices[0].message.content}
async function ai(p,sys,json){
 let msgs=Array.isArray(p)?p:[{role:'user',parts:[{text:p}]}];if(msgs.length>12)msgs=[msgs[0],...msgs.slice(-10)];let last,quota=0;
 for(const pr of S.provs)for(let k=0;k<2;k++){try{const t=await call(pr,msgs,sys,json);return json?parse(t):t}catch(e){last=e;if(/quota|rate.?limit|429|exceed/i.test(e.message)){quota=1;break}await new Promise(r=>setTimeout(r,1200))}}
 throw new Error(quota?'Free quota reached on your AI key(s). Wait about a minute, or add a Groq key under "API keys" (it has a much higher free limit).':'All providers failed ('+last.message+')')}
const keyRows=()=>Object.keys(PV).map(id=>`<label>${PV[id].n} key <span class="m">(${PV[id].h})</span><input id="k_${id}" value="${esc((S?.provs||[]).find(p=>p.id==id)?.key||'')}"></label>`).join('');
const readKeys=()=>Object.keys(PV).filter(id=>$('#k_'+id).value.trim()).map(id=>({id,key:$('#k_'+id).value.trim(),model:PV[id].m}));
function keys(){R(`<div class="card"><h3>API keys</h3><p class="m">Keys are tried in this order; if one is busy the next is used automatically.</p>${keyRows()}<div class="row"><button onclick="const k=readKeys();if(!k.length)return alert('Add at least one key');S.provs=k;save();home()">Save</button><button class="g" onclick="home()">Back</button></div></div>`)}

/* ---------- Speech (browser, Chrome/Edge recommended) ---------- */
function say(txt,t,rate){if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang=LANG[t||cur];u.rate=rate||.9;speechSynthesis.speak(u)}
const st=m=>{const e=$('#st');if(e)e.textContent=m};
let rec;
function listen(cb){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return alert('Speech input needs Chrome or Edge.');
 if(window.speechSynthesis)speechSynthesis.cancel();if(rec)try{rec.abort()}catch(e){}
 const r=rec=new SR();r.lang=LANG[cur];r.interimResults=false;let txt='';r.onstart=()=>st('🎙 Listening… speak now');r.onresult=e=>{txt=[...e.results].map(x=>x[0].transcript).join(' ')};r.onend=()=>{st('');if(txt.trim())cb(txt.trim())};
 r.onerror=e=>{if(e.error=='aborted')return;alert(e.error=='not-allowed'||e.error=='service-not-allowed'?'Microphone is blocked. Click the lock icon in the address bar, allow Microphone, then reload.':e.error=='no-speech'?'I did not hear anything. Click Speak, then talk right away.':'Mic error: '+e.error)};
 setTimeout(()=>{try{r.start()}catch(e){}},300)}

/* ---------- Prompts ---------- */
const SYS={
de:`You are a friendly German tutor and certified Goethe-Institut/TestDaF examiner running a spoken-style conversation lesson. Keep replies under 70 words. Reply in German suited to the learner's level (absolute beginner: very short, simple sentences) and end the German part with ONE question. Then add, each on a SINGLE line: "EN: " English translation, and only if the learner made mistakes "FIX: " the corrections. Never change the topic until the learner has answered.`,
en:`You are a certified IELTS Speaking examiner and coach running a conversation lesson on today's topic. Follow the real order: Part 1 (about 5 questions), then a Part 2 cue card, then Part 3 discussion. Ask ONE question at a time and do not move on until the learner has given a full answer. Reply format, each on a SINGLE line: "FIX: " corrections plus a stronger band-8 version of the learner's actual answer, "BAND: " estimate for that answer, then a blank line, then "Q: " the next question. Under 60 words in total. For the very first message only greet briefly and ask the first Part 1 question as "Q: ".`};
const EX=`You are a strict, certified examiner. Produce and mark tasks that mirror the authentic format, difficulty and marking criteria of the real exam. Output valid JSON only when asked.`;
const exam=t=>t=='de'?S.tr.de.exam:'IELTS (Speaking & Listening only)';
function topic(t){const T=S.tr[t];let d=T.day;for(const p of T.plan.phases){if(d<p.days)return p;d-=p.days}return T.plan.phases.at(-1)}
function ctx(t){const T=S.tr[t],p=topic(t);return `Learner level now: ${T.cur}. Goal: ${T.goal}. Day ${T.day+1}/${T.days}, phase "${p.name}", topics: ${p.topics.join(', ')}. Weak areas to emphasise: ${T.notes||'none yet'}.`}

async function mkPlan(t){const T=S.tr[t];
 return ai(`Learner: ${t=='de'?`absolute beginner in German aiming for ${T.exam}. Cover all 4 modules (Lesen, Hören, Schreiben, Sprechen)`:`IELTS, current ${T.cur}, target band ${T.goal}. ONLY speaking and listening`}. Days available: ${T.days}. Study minutes per day: ${T.min}. Training is conversation-based with an AI tutor (voice/chat) plus one exam-style test every day. Return JSON {"verdict":"honest 1-2 sentence feasibility check","phases":[{"name":"","days":0,"topics":[""]}] (days sum to ${T.days}),"timetable":[{"activity":"","minutes":0}] (minutes sum to ${T.min}, includes the daily test)}`,EX,true)}

/* ---------- Setup ---------- */
function setup(){R(`<div class="card"><h2>Polyglot Coach – setup</h2>
<p class="m">Add at least one free key (Groq is fast and recommended). With several keys the app switches automatically when one is busy.</p>${keyRows()}
<h3>🇩🇪 German (starting from zero)</h3><div class="row">
<label>Target exam<select id="dg"><option>A1</option><option>A2</option><option selected>B1</option><option>B2</option><option>C1</option><option>TestDaF</option></select></label>
<label>Days available<input id="dd" type="number" value="120"></label><label>Minutes/day<input id="dm" type="number" value="90"></label></div>
<h3>🇬🇧 IELTS (Speaking + Listening)</h3><div class="row">
<label>Target band<select id="eg">${[9,8.5,8,7.5,7,6.5,6].map(b=>`<option ${b==8?'selected':''}>${b.toFixed(1)}</option>`).join('')}</select></label>
<label>Current band (estimate)<select id="ec">${[7.5,7,6.5,6,5.5,5].map(b=>`<option ${b==6.5?'selected':''}>${b.toFixed(1)}</option>`).join('')}</select></label>
<label>Days available<input id="ed" type="number" value="45"></label><label>Minutes/day<input id="em" type="number" value="45"></label></div>
<button onclick="setupGo()">Build my syllabus & timetable</button></div>`)}
async function setupGo(){const g=i=>$('#'+i).value;
 const provs=readKeys();if(!provs.length)return alert('Enter at least one API key');
 S={provs,tr:{
  de:{goal:g('dg'),exam:g('dg')=='TestDaF'?'TestDaF':'Goethe-Zertifikat '+g('dg'),cur:'Absolute beginner (A0)',days:+g('dd'),min:+g('dm'),day:0,hist:[],notes:''},
  en:{goal:g('eg'),cur:'Band '+g('ec'),days:+g('ed'),min:+g('em'),day:0,hist:[],notes:''}}};
 R(load('Building your syllabus and timetable…'));
 try{for(const t of['de','en'])S.tr[t].plan=await mkPlan(t);save();home()}catch(e){alert(e.message);S=null;setup()}}
function resetAll(){if(confirm('Delete all progress and settings?')){localStorage.removeItem('pc');S=null;setup()}}

/* ---------- Dashboard ---------- */
function sw(t){cur=t;chat=[];home()}
function home(){if(!S)return setup();const T=S.tr[cur],p=topic(cur),pct=Math.min(100,Math.round(T.day/T.days*100)),h=T.hist.at(-1);
 R(`<div class="tabs"><button class="${cur=='de'?'on':''}" onclick="sw('de')">🇩🇪 German</button><button class="${cur=='en'?'on':''}" onclick="sw('en')">🇬🇧 IELTS</button></div>
 <div class="card"><div class="m">${esc(exam(cur))} · target ${T.goal}</div><h2>Day ${Math.min(T.day+1,T.days)} <span class="m">of ${T.days}</span></h2><div class="bar"><i style="width:${pct}%"></i></div>
 <div class="stats"><div><b>${esc(T.cur)}</b><span>Current level</span></div><div><b>${T.hist.length}</b><span>Tests done</span></div><div><b>${h?esc(h.overall):'–'}</b><span>Last result</span></div></div>
 <p class="m">${esc(T.plan.verdict)}</p><p><b>Today · ${esc(p.name)}</b><br>${esc(p.topics.join(' · '))}</p>${T.notes?`<p class="note">🎯 Focus from last test: ${esc(T.notes)}</p>`:''}
 <div class="row"><button onclick="lesson()">💬 ${(T.lessons||{})[T.day+1]?'Continue':'Start'} conversation lesson</button><button onclick="startTest()">📝 Take daily test</button></div></div>
 <div class="grid"><div class="card"><b>Daily timetable (${T.min} min)</b><ul>${T.plan.timetable.map(x=>`<li>${esc(x.activity)} – ${x.minutes} min</li>`).join('')}</ul></div>
 <div class="card"><b>Syllabus</b>${T.plan.phases.map(x=>`<details><summary>${esc(x.name)} (${x.days} days)</summary><ul>${x.topics.map(y=>`<li>${esc(y)}</li>`).join('')}</ul></details>`).join('')}</div></div>
 <div class="row foot"><button class="g" onclick="hist()">📚 History</button><button class="g" onclick="keys()">🔑 API keys</button><button class="g" onclick="exp()">⬇ Backup</button><label class="btn">⬆ Restore<input type="file" accept=".json" hidden onchange="imp(this)"></label><button class="g" onclick="resetAll()">Reset</button></div>`)}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='polyglot-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click()}
function imp(i){const f=i.files[0];if(f)f.text().then(t=>{try{S=JSON.parse(t);save();home()}catch(e){alert('Invalid backup file')}})}
function hist(){const T=S.tr[cur],L=T.lessons||{},days=[...new Set([...Object.keys(L).map(Number),...T.hist.map(h=>h.day)])].sort((a,b)=>b-a);
 R(`<div class="row"><h2>📚 ${cur=='de'?'German':'IELTS'} history</h2><button class="g" onclick="home()">← Back</button></div>`+(days.map(d=>{const h=T.hist.find(x=>x.day==d),l=L[d];
 return `<details class="card"><summary><b>Day ${d}</b> <span class="m">${h?esc(h.date)+' · '+esc(h.overall):'lesson only'}</span></summary>
 ${h?`<table>${(h.scores||[]).map(s=>`<tr><td><b>${esc(s.skill)}</b></td><td>${s.score}/${s.max}</td><td>${esc(s.comment)}</td></tr>`).join('')}</table><p class="m">Level: ${esc(h.level||'')} · Next focus: ${esc(h.note||'')}</p>
 ${(h.mistakes||[]).map(m=>`<p>❌ ${esc(m.you)}<br>✅ ${esc(m.better)}<br><span class="m">${esc(m.why)}</span></p>`).join('')}
 ${h.rows?`<details><summary>📝 Your test answers</summary>${h.rows.map(r=>`<p><b>${esc(r.q)}</b><br>You: ${esc(r.user)}${r.correct?`<br>Correct: ${esc(r.correct)}`:''}</p>`).join('')}</details>`:''}`:''}
 ${l?`<details><summary>💬 Lesson transcript (${l.length} messages)</summary>${l.map(m=>`<div class="msg ${m.r=='user'?'u':'a'}">${esc(m.t)}</div>`).join('')}</details>`:''}</details>`}).join('')||'<div class="card m">Nothing yet. Finish a lesson or test and it will appear here.</div>'))}

/* ---------- Conversation lesson ---------- */
const spoken=t=>{const m=t.match(/(?:^|\n)\s*Q:\s*([\s\S]*)$/);return m?m[1].trim():t.split('\n').filter(l=>!/^\s*\**(FIX|BAND|EN|Band[- ]?8)/i.test(l)).join(' ').trim()};
const fmt=t=>t.split('\n').map(l=>!l.trim()?'<br>':/^\s*(FIX|BAND|EN)\s*:/i.test(l)?`<div class="m">${esc(l)}</div>`:`<div>${esc(l.replace(/^\s*Q:\s*/,''))}</div>`).join('');
function rep(i,rate){const m=i?chat[i]:[...chat].reverse().find(x=>x.role=='model');if(m)say(spoken(m.parts[0].text),cur,rate)}
function saveL(){const T=S.tr[cur];(T.lessons=T.lessons||{})[T.day+1]=chat.slice(1).map(m=>({r:m.role,t:m.parts[0].text}));save()}
function lesson(){const T=S.tr[cur],d=T.day+1,old=(T.lessons||{})[d]||[];
 chat=[{role:'user',parts:[{text:"Start today's lesson with a greeting and your first question."}]},...old.map(m=>({role:m.r,parts:[{text:m.t}]}))];
 R(`<div class="card"><div class="row"><b>${cur=='de'?'🇩🇪 German':'🇬🇧 IELTS'} lesson · Day ${d}</b><button class="g" onclick="home()">← Back</button></div><div id="log"></div><div id="st" class="m"></div>
 <div class="row"><input id="in" placeholder="Type your answer, or use the microphone" onkeydown="if(event.key=='Enter')snd()"><button onclick="listen(x=>snd(x))">🎤 Speak</button><button onclick="snd()">Send</button></div>
 <div class="row"><button class="g" onclick="rep()">🔁 Repeat last</button><button class="g" onclick="rep(0,.6)">🐢 Repeat slowly</button><label><input type="checkbox" id="sp" checked> Read replies aloud</label></div></div>`);
 old.length&&old.at(-1).r=='model'?log():turn()}
function log(){$('#log').innerHTML=chat.slice(1).map((m,i)=>`<div class="msg ${m.role=='user'?'u':'a'}">${m.role=='model'?fmt(m.parts[0].text):esc(m.parts[0].text)}${m.role=='model'?`<button class="ic" title="Play again" onclick="rep(${i+1})">🔊</button>`:''}</div>`).join('');$('#log').scrollTop=1e9}
let busy=false;
async function turn(){if(busy)return;busy=true;try{$('#log').innerHTML+='<div class="m">Tutor is typing…</div>';const r=await ai(chat,SYS[cur]+'\n'+ctx(cur));chat.push({role:'model',parts:[{text:r}]});saveL();log();if($('#sp').checked)say(spoken(r))}catch(e){alert(e.message);log()}finally{busy=false;st('')}}
function snd(v){if(busy)return st('Please wait, the tutor is still replying…');const i=$('#in'),t=(v||i.value).trim();if(!t)return;i.value='';chat.push({role:'user',parts:[{text:t}]});saveL();log();turn()}

/* ---------- Daily exam-style test ---------- */
async function startTest(){R(load('Preparing today\'s exam-style test…'));const T=S.tr[cur];
 const fmt=cur=='de'?`Sections (in this order): "reading" (1 passage in "passage", 4 multiple-choice items), "listening" (audio transcript in "script", 4 multiple-choice items), "writing" (one task with required content points and minimum words, 1 item), "speaking" (2-3 prompts typical of the exam, items).`
 :`Sections: "listening" (IELTS-style transcript in "script", 5 items: mix of multiple-choice and short-answer), "speaking" (Part 1: 4 questions; Part 2: cue card with 1 item; Part 3: 3 abstract discussion questions).`;
 try{test=await ai(`Create today's daily test (~25 min) for ${exam(cur)}. ${ctx(cur)} Mirror the real exam task types for the learner's current level, moving toward the target. ${fmt} Return JSON {"title":"","sections":[{"skill":"reading|listening|writing|speaking","instructions":"","passage":"optional","script":"optional","items":[{"q":"","options":["optional"],"answer":0 (index of correct option, only with options)}]}]}. ${cur=='de'?'Write tasks in German (with English instructions only for A1/A2).':''}`,EX,true);plays={};testView()}catch(e){alert(e.message);home()}}
function testView(){R(`<div class="card"><div class="row"><h3 style="margin:0">${esc(test.title)}</h3><button class="g" onclick="home()">Cancel</button></div></div>`+
 test.sections.map((s,i)=>`<div class="card"><b>${s.skill.toUpperCase()}</b><p class="m">${esc(s.instructions)}</p>${s.passage?`<p>${esc(s.passage)}</p>`:''}
 ${s.script?`<button class="g" onclick="play(${i})">▶ Play audio (<span id="pl${i}">2</span> plays left)</button>`:''}
 ${s.items.map((it,j)=>`<p><b>${esc(it.q)}</b></p>`+(it.options?it.options.map((o,k)=>`<label style="display:block"><input type="radio" name="a${i}_${j}" value="${k}"> ${esc(o)}</label>`).join(''):
 `<textarea id="a${i}_${j}" rows="${s.skill=='writing'?8:3}"></textarea>`+(s.skill=='speaking'?`<div class="row"><button class="g" onclick="sayQ(${i},${j})">🔊 Hear question</button><button class="g" onclick="listen(x=>$('#a${i}_${j}').value+=x+' ')">🎤 Answer by voice</button></div>`:''))).join('')}</div>`).join('')+
 `<button onclick="submit()">Submit for marking</button>`)}
function play(i){const n=plays[i]??2;if(n<1)return;plays[i]=n-1;$('#pl'+i).textContent=n-1;say(test.sections[i].script)}
function sayQ(i,j){say(test.sections[i].items[j].q)}
async function submit(){const rows=[];
 test.sections.forEach((s,i)=>s.items.forEach((it,j)=>{if(it.options){const c=document.querySelector(`input[name=a${i}_${j}]:checked`);rows.push({skill:s.skill,q:it.q,user:c?it.options[c.value]:'(no answer)',correct:it.options[it.answer]})}
 else rows.push({skill:s.skill,q:it.q,user:$('#a'+i+'_'+j).value||'(no answer)'})}));
 R(load('Examiner is marking your test…'));const T=S.tr[cur];
 const scale=cur=='de'?`Use official-style scoring: each module out of 25 points (total 100, pass 60 for Goethe; for TestDaF give TDN level). overallLabel like "72/100 – passed".`:`Use official IELTS band descriptors (fluency, lexical resource, grammar, pronunciation as far as a transcript allows; listening raw score to band). overallLabel like "Band 7.0".`;
 try{const r=await ai(`Mark this learner's test for ${exam(cur)}. ${ctx(cur)} Multiple-choice rows include the correct answer; grade free answers strictly against the real exam criteria. Speaking answers are voice transcripts, so judge content, grammar, vocabulary and coherence and say honestly that pronunciation cannot be fully assessed. ${scale} Also decide how tomorrow's plan must change. Answers: ${JSON.stringify(rows)}
 Return JSON {"scores":[{"skill":"","score":0,"max":0,"comment":""}],"overallLabel":"","mistakes":[{"you":"","better":"","why":""}],"weak":[""],"daysDelta":0 (integer -5..5, change in total days),"focus":[""],"note":"what to emphasise next","level":"estimated current level, e.g. A1 or Band 6.5"}`,EX,true);
 T.hist.push({day:T.day+1,date:new Date().toLocaleDateString(),overall:r.overallLabel,scores:r.scores,mistakes:r.mistakes,level:r.level,note:r.note,rows});T.day++;
 T.days=Math.max(T.day+1,T.days+Math.max(-5,Math.min(5,r.daysDelta||0)));T.cur=r.level||T.cur;T.notes=[r.note,...(r.focus||[])].filter(Boolean).join('; ');save();
 R(`<div class="card"><h2 style="margin:0">${esc(r.overallLabel)}</h2><p class="m">Estimated level: ${esc(T.cur)} · plan adjusted by ${r.daysDelta||0} day(s)</p>
 <table>${r.scores.map(s=>`<tr><td><b>${esc(s.skill)}</b></td><td>${s.score}/${s.max}</td><td>${esc(s.comment)}</td></tr>`).join('')}</table></div>
 <div class="card"><b>Corrections</b>${r.mistakes.map(m=>`<p>❌ ${esc(m.you)}<br>✅ ${esc(m.better)}<br><span class="m">${esc(m.why)}</span></p>`).join('')}</div>
 <div class="card"><b>Next focus:</b> ${esc(T.notes)}<div class="row"><button onclick="home()">Back to dashboard</button></div></div>`)}
 catch(e){alert(e.message);home()}}

S?home():setup();
</script></body></html>
